<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Giriş / Kayıt — Şuarâ-yı Mecmua</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .auth-wrapper {
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
  }
  .auth-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-lg);
    border-radius: var(--r-lg);
    padding: 3rem 2rem;
    width: 100%;
    max-width: 450px;
  }
  .auth-tabs {
    display: flex;
    gap: 1rem;
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 1rem;
  }
  .auth-tab {
    flex: 1;
    text-align: center;
    cursor: pointer;
    font-family: var(--font-serif);
    font-size: 1.3rem;
    color: var(--text-muted);
    transition: 0.3s;
  }
  .auth-tab.active {
    color: var(--gold);
    font-weight: 600;
  }
  .auth-form {
    display: none;
  }
  .auth-form.active {
    display: block;
  }
  .auth-form input {
    width: 100%;
    padding: 1rem;
    background: var(--bg-body);
    border: 1px solid var(--border-color);
    border-radius: var(--r);
    color: var(--text);
    margin-bottom: 1.2rem;
    font-family: var(--font-sans);
    outline: none;
  }
  .auth-form input:focus { border-color: var(--gold); }
  .forgot-pass-link {
    display: block;
    text-align: right;
    font-size: 0.85rem;
    color: var(--gold);
    margin-top: -0.8rem;
    margin-bottom: 1.5rem;
    cursor: pointer;
  }
  .divider {
    margin: 1.5rem 0;
    text-align: center;
    position: relative;
  }
  .divider span {
    background: var(--bg-card);
    padding: 0 12px;
    font-size: 0.8rem;
    color: var(--text-muted);
    position: relative;
    z-index: 1;
  }
  .divider::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    border-top: 1px solid var(--border-color);
    z-index: 0;
  }
  .verify-banner {
    display: none;
    background: rgba(212,175,55,0.1);
    border: 1px solid var(--gold-glow);
    padding: 1rem;
    border-radius: var(--r);
    margin-bottom: 1.5rem;
    font-size: 0.85rem;
    color: var(--gold-dark);
  }
</style>
</head>
<body>

<nav class="nav" id="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <span class="logo-ar">شعراء</span>
      <span class="logo-tr">Şuarâ-yı Mecmua</span>
    </a>
  </div>
</nav>

<section class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-tabs">
      <div class="auth-tab active" id="tabGiris" onclick="switchAuthTab('giris')">Giriş Yap</div>
      <div class="auth-tab" id="tabKayit" onclick="switchAuthTab('kayit')">Kayıt Ol</div>
    </div>

    <div class="verify-banner" id="verifyBanner">
      E-posta doğrulanmamış. <a onclick="tekrarGonder()" style="color:var(--gold); font-weight:600; cursor:pointer; text-decoration:underline;">Tekrar gönder</a>.
    </div>

    <!-- GİRİŞ FORMU -->
    <form id="formGiris" class="auth-form active" onsubmit="girisYap(event)">
      <input type="email" id="loginEmail" placeholder="E-Posta Adresiniz" required>
      <input type="password" id="loginPass" placeholder="Şifreniz" required>
      <a class="forgot-pass-link" onclick="switchAuthTab('reset')">Şifremi unuttum?</a>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="btnLogin">Sisteme Gir</button>
      
      <div class="divider"><span>Veya</span></div>
      
      <button type="button" class="btn-google" onclick="googleGiris()" style="width:100%;">
        <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:10px; vertical-align:middle;">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Google ile Devam Et
      </button>
    </form>

    <!-- KAYIT FORMU -->
    <form id="formKayit" class="auth-form" onsubmit="kayitOl(event)">
      <input type="text" id="regName" placeholder="Adınız Soyadınız" required>
      <input type="email" id="regEmail" placeholder="E-Posta Adresiniz" required>
      <input type="password" id="regPass" placeholder="Şifreniz" required minlength="6">
      <button type="submit" class="btn btn-secondary" style="width:100%;" id="btnReg">Hesap Oluştur</button>
      
      <div class="divider"><span>Veya</span></div>

      <button type="button" class="btn-google" onclick="googleGiris()" style="width:100%;">
        <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:10px; vertical-align:middle;">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Google ile Devam Et
      </button>
      <p style="text-align:center; font-size:0.8rem; color:var(--text-muted); margin-top:1rem;">Doğrulama maili gönderilecektir.</p>
    </form>

    <!-- ŞİFRE SIFIRLAMA -->
    <div id="formReset" class="auth-form">
      <div id="resetFormInner">
        <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:1rem;">Sıfırlama linki için e-postanızı girin.</p>
        <input type="email" id="resetEmail" placeholder="E-Posta Adresiniz">
        <button class="btn btn-secondary" style="width:100%;" onclick="sifreSifirla()">Gönder</button>
        <button class="btn btn-outline" style="width:100%; margin-top:0.5rem;" onclick="switchAuthTab('giris')">Geri Dön</button>
      </div>
      <div id="resetSuccess" style="display:none; text-align:center; padding:1rem;">
        <p style="color:var(--gold);">Bağlantı gönderildi!</p>
        <button class="btn btn-primary" style="margin-top:1rem;" onclick="switchAuthTab('giris')">Giriş Yap</button>
      </div>
    </div>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="main.js"></script>
</body>
</html>
